services:
  db:
    image: postgres:16-alpine
    container_name: kvitto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kvitto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data 

    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U postgres -d kvitto
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: kvitto-api
    restart: unless-stopped

    environment:
      DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/kvitto
      DB_ECHO: "false"
      WEBHOOK_SECRET: "12345"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: