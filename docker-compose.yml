services:
  db:
    image: postgres:16-alpine
    container_name: kvitto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kvitto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data 

    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U postgres -d kvitto
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: