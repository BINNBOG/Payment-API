name: CI

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:

permissions:
  contents: read


jobs:
  build:
    name: Build, DB and application checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: kvitto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d kvitto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kvitto
      DB_ECHO: "false"
      WEBHOOK_SECRET: test-webhook-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build --tag kvitto-api:ci .

      - name: Start application and run health check
        shell: bash
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > uvicorn.log 2>&1 &

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Application health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "Application did not become healthy"
          cat uvicorn.log
          exit 1


  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        id: semgrep
        run: >-
          semgrep scan
          --config auto
          --error
          --sarif
          --output semgrep-results.sarif
          .
        continue-on-error: true

      - name: Upload Semgrep artifact
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sast-results
          path: semgrep-results.sarif
          retention-days: 14

      - name: Upload Semgrep results to GitHub Code Scanning
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep


  sca:
    name: SCA - Snyk
    runs-on: ubuntu-latest

    needs:
      - build

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Setup Node.js for Snyk CLI
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Run Snyk SCA
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          snyk test
          --file=requirements.txt
          --package-manager=pip
          --command=python
          --severity-threshold=high
          --sarif-file-output=snyk-results.sarif
        continue-on-error: true

      - name: Upload Snyk artifact
        if: always() && hashFiles('snyk-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: snyk-sca-results
          path: snyk-results.sarif
          retention-days: 14

      - name: Upload Snyk results to GitHub Code Scanning
        if: always() && hashFiles('snyk-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-results.sarif
          category: snyk

      - name: Send dependency snapshot to Snyk
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master')
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >-
          snyk monitor
          --file=requirements.txt
          --package-manager=pip
          --command=python
          --project-name="${{ github.repository }}"
        continue-on-error: true
